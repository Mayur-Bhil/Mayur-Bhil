<?xml version="1.0" encoding="UTF-8"?>
<svg width="860" height="300" viewBox="0 0 860 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Terminal card: Mayur Bhil, full-stack and DevOps engineer, Surat India, MERN, Next.js, Docker, AWS, open for freelance" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00d9ff"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
  </defs>

  <style>
    .t     { font: 400 16px 'SFMono-Regular', Consolas, 'Liberation Mono', monospace; }
    .p     { fill: #39d353; }
    .k     { fill: #8b949e; }
    .v     { fill: #e6edf3; }
    .a     { fill: #00d9ff; }
    .b     { fill: #a78bfa; }
    .title { font: 400 13px 'SFMono-Regular', Consolas, monospace; fill: #8b949e; }
    .row   { opacity: 0; animation: show 0.5s ease-out forwards; }
    .r1 { animation-delay: 0.3s; } .r2 { animation-delay: 0.9s; } .r3 { animation-delay: 1.5s; }
    .r4 { animation-delay: 2.1s; } .r5 { animation-delay: 2.7s; } .r6 { animation-delay: 3.3s; }
    .cursor { animation: blink 1s steps(1) infinite; animation-delay: 3.8s; opacity: 0; }
    @keyframes show  { from { opacity: 0; transform: translateX(-8px); } to { opacity: 1; transform: translateX(0); } }
    @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) {
      .row { opacity: 1; animation: none; }
      .cursor { opacity: 1; animation: none; }
    }
  </style>

