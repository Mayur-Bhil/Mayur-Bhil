<?xml version="1.0" encoding="UTF-8"?>
<svg width="860" height="220" viewBox="0 0 860 220" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Mayur Bhil, Full-Stack and DevOps Engineer from Surat, India" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#151b26"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00d9ff"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <radialGradient id="glowA" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#00d9ff" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#00d9ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#a78bfa" stop-opacity="0.26"/>
      <stop offset="1" stop-color="#a78bfa" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="card"><rect width="860" height="220" rx="18"/></clipPath>
  </defs>

  <style>
    .name  { font: 700 54px 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; fill: url(#accent); letter-spacing: 1px; }
    .role  { font: 500 20px 'SFMono-Regular', Consolas, 'Liberation Mono', monospace; fill: #c9d1d9; letter-spacing: 1.5px; }
    .meta  { font: 400 14px 'SFMono-Regular', Consolas, 'Liberation Mono', monospace; fill: #8b949e; letter-spacing: 1px; }
    .fade  { opacity: 0; animation: fadeUp 0.9s ease-out forwards; }
    .d1 { animation-delay: 0.15s; } .d2 { animation-delay: 0.55s; } .d3 { animation-delay: 0.95s; }
    .pulse { animation: pulse 2.4s ease-in-out infinite; }
    @keyframes fadeUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes pulse  { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }
    @media (prefers-reduced-motion: reduce) {
      .fade { opacity: 1; animation: none; }
      .pulse { animation: none; }
    }
  </style>

  <g clip-path="url(#card)">
    <rect width="860" height="220" fill="url(#bg)"/>
    <circle cx="150" cy="40" r="190" fill="url(#glowA)">
      <animateTransform attributeName="transform" type="translate" values="0 0; 40 20; 0 0" dur="12s" repeatCount="indefinite"/>
    </circle>
    <circle cx="720" cy="190" r="200" fill="url(#glowB)">
      <animateTransform attributeName="transform" type="translate" values="0 0; -40 -16; 0 0" dur="14s" repeatCount="indefinite"/>
    </circle>
    <g stroke="#ffffff" stroke-opacity="0.04">
      <path d="M0 55H860M0 110H860M0 165H860M215 0V220M430 0V220M645 0V220"/>
    </g>
  </g>
  <rect x="1" y="1" width="858" height="218" rx="17" fill="none" stroke="url(#accent)" stroke-opacity="0.55" stroke-width="1.5"/>

  <text x="430" y="98" text-anchor="middle" class="name fade d1">Mayur Bhil</text>
  <text x="430" y="138" text-anchor="middle" class="role fade d2">Full-Stack  ·  DevOps  ·  Data</text>
  <rect x="380" y="154" width="100" height="2" rx="1" fill="url(#accent)" class="fade d2"/>
  <text x="430" y="188" text-anchor="middle" class="meta fade d3">
    <tspan>Surat, India</tspan><tspan dx="14">·</tspan><tspan dx="14" fill="#39d353" class="pulse">●</tspan><tspan dx="6">open for freelance</tspan>
  </text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
